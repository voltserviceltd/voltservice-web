substitutions:
  _REGION: europe-west1
  _SERVICE: voltservice-web
  # Artifact Registry Docker names use "/" instead of ":" for legacy
  # domain-scoped project IDs, for example example.com/my-project.
  _AR_PROJECT_PATH: voltservice-web
  _AR_REPOSITORY: voltservice
  _RUNTIME_SERVICE_ACCOUNT: voltserviceltd-cloud-run-runti@voltservice-web.iam.gserviceaccount.com
  # PLACEHOLDER — confirm the real production domain before first deploy.
  _NEXT_PUBLIC_SITE_URL: https://metalbrain.net
  _NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ""
  # Instance bounds for the Cloud Run service (translates to the
  # autoscaling.knative.dev/minScale and maxScale annotations under the hood).
  # min=1 keeps one instance warm to avoid cold starts; max=4 caps the bill.
  _MIN_INSTANCES: "1"
  _MAX_INSTANCES: "4"
  # The org policy constraints/run.allowedIngress (see allowed_ingress_policy.yaml)
  # only permits "internal" and "internal-and-cloud-load-balancing" — the
  # default "all" is rejected. This value requires traffic to arrive via a
  # Cloud Load Balancer (Serverless NEG); the service is not reachable on
  # its own *.run.app URL until that load balancer exists.
  _INGRESS: internal-and-cloud-load-balancing

steps:
  - id: run-tests
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --target
      - tester
      - --build-arg
      - NEXT_PUBLIC_SITE_URL=${_NEXT_PUBLIC_SITE_URL}
      - --build-arg
      - NEXT_PUBLIC_RECAPTCHA_SITE_KEY=${_NEXT_PUBLIC_RECAPTCHA_SITE_KEY}
      - -t
      - voltservice-web-test:$COMMIT_SHA
      - .

  - id: build-image
    name: gcr.io/cloud-builders/docker
    waitFor:
      - run-tests
    args:
      - build
      - --target
      - runtime
      - --build-arg
      - NEXT_PUBLIC_SITE_URL=${_NEXT_PUBLIC_SITE_URL}
      - --build-arg
      - NEXT_PUBLIC_RECAPTCHA_SITE_KEY=${_NEXT_PUBLIC_RECAPTCHA_SITE_KEY}
      - -t
      - ${_REGION}-docker.pkg.dev/${_AR_PROJECT_PATH}/${_AR_REPOSITORY}/${_SERVICE}:$COMMIT_SHA
      - .

  - id: push-image
    name: gcr.io/cloud-builders/docker
    waitFor:
      - build-image
    args:
      - push
      - ${_REGION}-docker.pkg.dev/${_AR_PROJECT_PATH}/${_AR_REPOSITORY}/${_SERVICE}:$COMMIT_SHA

  - id: deploy-cloud-run
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    waitFor:
      - push-image
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image
      - ${_REGION}-docker.pkg.dev/${_AR_PROJECT_PATH}/${_AR_REPOSITORY}/${_SERVICE}:$COMMIT_SHA
      - --region
      - ${_REGION}
      - --platform
      - managed
      - --allow-unauthenticated
      - --service-account
      - ${_RUNTIME_SERVICE_ACCOUNT}
      - --min-instances
      - ${_MIN_INSTANCES}
      - --max-instances
      - ${_MAX_INSTANCES}
      - --ingress
      - ${_INGRESS}
      - --set-env-vars
      - NODE_ENV=production,NEXT_PUBLIC_SITE_URL=${_NEXT_PUBLIC_SITE_URL},NEXT_PUBLIC_RECAPTCHA_SITE_KEY=${_NEXT_PUBLIC_RECAPTCHA_SITE_KEY}

images:
  - ${_REGION}-docker.pkg.dev/${_AR_PROJECT_PATH}/${_AR_REPOSITORY}/${_SERVICE}:$COMMIT_SHA

options:
  logging: CLOUD_LOGGING_ONLY
